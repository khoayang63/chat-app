services:
  app:
    build:
      context: .
      target: runtime
    image: ptit-messaging:local
    container_name: ptit-messaging
    ports:
      - "4000:4000"
    environment:
      PORT: "4000"
      DB_PATH: /app/data/ptit.db
      # Same-origin in the container (Express serves dist/ and the API).
      CLIENT_ORIGIN: ${CLIENT_ORIGIN:-http://localhost:4000}
    volumes:
      - ptit-data:/app/data
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:4000/api/health').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    restart: unless-stopped

volumes:
  ptit-data:
    name: ptit-messaging-data
